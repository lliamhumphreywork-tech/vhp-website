<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHP · Marketing</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#080808;
  --surface:#0e0e0e;
  --border:rgba(255,255,255,0.1);
  --text:#ffffff;
  --muted:#999999;
  --dim:#555555;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:13px;
  line-height:1.5;
  height:100%;
  -webkit-font-smoothing:antialiased;
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── HEADER ──────────────────────────────────────────── */
.header{
  height:50px;
  border-bottom:0.5px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:50;
  animation:fadeIn 0.5s var(--ease) both;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.header-ws{
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--muted);
  text-decoration:none;
  transition:color 0.15s;
}

.header-ws:hover{ color:var(--text); }

.header-sep{
  font-size:10px;
  color:var(--dim);
}

.header-module{
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--text);
}

.header-right{
  display:flex;
  align-items:center;
  gap:24px;
}

.header-nav-link{
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--muted);
  text-decoration:none;
  transition:color 0.15s;
}
.header-nav-link:hover{ color:var(--text); }

.header-settings-btn{
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--dim);
  cursor:pointer;
  transition:color 0.15s;
  background:none;
  border:none;
  font-family:var(--font);
  padding:0;
}
.header-settings-btn:hover{ color:var(--muted); }

#clock{
  font-size:11px;
  letter-spacing:0.06em;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

/* ── LAYOUT ──────────────────────────────────────────── */
.layout{
  display:grid;
  grid-template-columns:304px 1fr;
  height:calc(100vh - 50px);
}

/* ── FORM PANEL ──────────────────────────────────────── */
.form-panel{
  border-right:0.5px solid var(--border);
  padding:26px 22px;
  overflow-y:auto;
  animation:fadeUp 0.6s var(--ease) 0.06s both;
}

.panel-eyebrow{
  font-size:9px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--dim);
  margin-bottom:22px;
}

.field{ margin-bottom:14px; }

.field-label{
  display:block;
  font-size:9px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}

.field select,
.field input[type="datetime-local"],
.field textarea{
  width:100%;
  background:transparent;
  border:0.5px solid var(--border);
  color:var(--text);
  font-family:var(--font);
  font-size:12px;
  padding:9px 11px;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  border-radius:0;
  transition:border-color 0.15s;
}

.field select:focus,
.field input:focus,
.field textarea:focus{
  border-color:rgba(255,255,255,0.3);
}

.field textarea{
  resize:vertical;
  min-height:168px;
  line-height:1.7;
}

.field textarea::placeholder{
  color:var(--dim);
  font-size:12px;
}

.field select option{background:#111;color:#fff;}

.select-wrap{ position:relative; }
.select-wrap::after{
  content:'▾';
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  color:var(--dim);
  font-size:10px;
  pointer-events:none;
}

.field input[type="datetime-local"]{ color-scheme:dark; }
.field input[type="datetime-local"]::-webkit-calendar-picker-indicator{
  filter:invert(0.4);
  cursor:pointer;
}

.rule{
  height:0.5px;
  background:var(--border);
  margin:10px 0 20px;
}

/* ── WHATSAPP STATUS ─────────────────────────────────── */
.wa-status{
  margin-top:12px;
  padding:10px 12px;
  border:0.5px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.wa-label{
  font-size:9px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--muted);
}

.wa-number{
  font-size:10px;
  color:var(--text);
  font-variant-numeric:tabular-nums;
}

.wa-configure{
  font-size:9px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--dim);
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:3px;
  transition:color 0.15s;
}
.wa-configure:hover{ color:var(--muted); }

/* ── BUTTONS ─────────────────────────────────────────── */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 18px;
  font-family:var(--font);
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  cursor:pointer;
  border:0.5px solid rgba(255,255,255,0.35);
  background:transparent;
  color:var(--text);
  transition:background 0.12s,color 0.12s,border-color 0.12s;
  border-radius:0;
  white-space:nowrap;
  user-select:none;
}

.btn:hover{
  background:#ffffff;
  color:#080808;
  border-color:#ffffff;
}

.btn-primary{
  background:#ffffff;
  color:#080808;
  border-color:#ffffff;
}
.btn-primary:hover{
  background:#e0e0e0;
  border-color:#e0e0e0;
}

.btn-full{ width:100%; }

.btn-sm{
  padding:7px 13px;
  font-size:9px;
  letter-spacing:0.1em;
}

.btn-ghost{
  border-color:rgba(255,255,255,0.1);
  color:var(--muted);
}
.btn-ghost:hover{
  background:rgba(255,255,255,0.05);
  color:var(--text);
  border-color:rgba(255,255,255,0.2);
}

/* ── MAIN AREA ───────────────────────────────────────── */
.main-area{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  animation:fadeUp 0.65s var(--ease) 0.12s both;
}

/* ── TABS ─────────────────────────────────────────────── */
.tabs{
  border-bottom:0.5px solid var(--border);
  padding:0 28px;
  display:flex;
  flex-shrink:0;
}

.tab-btn{
  padding:14px 18px;
  font-size:10px;
  letter-spacing:0.13em;
  text-transform:uppercase;
  color:var(--muted);
  cursor:pointer;
  border:none;
  background:transparent;
  font-family:var(--font);
  border-bottom:1px solid transparent;
  margin-bottom:-0.5px;
  transition:color 0.15s;
  display:flex;
  align-items:center;
  gap:8px;
  border-radius:0;
}

.tab-btn:hover{ color:rgba(255,255,255,0.6); }

.tab-btn.active{
  color:var(--text);
  border-bottom-color:var(--text);
}

.badge{
  display:inline-block;
  font-size:9px;
  font-family:var(--font);
  padding:2px 7px;
  background:rgba(255,255,255,0.07);
  color:var(--dim);
  letter-spacing:0;
  border-radius:1px;
  transition:background 0.15s,color 0.15s;
}

.tab-btn.active .badge{
  background:#ffffff;
  color:#080808;
}

/* ── TAB PANELS ──────────────────────────────────────── */
.tab-panel{
  display:none;
  overflow-y:auto;
  flex:1;
  padding:24px 28px;
}
.tab-panel.active{ display:block; }

/* ── CARDS ───────────────────────────────────────────── */
.cards{ display:flex; flex-direction:column; gap:10px; }

.card{
  border:0.5px solid var(--border);
  animation:cardIn 0.5s var(--ease) both;
}

.card-header{
  padding:12px 16px;
  border-bottom:0.5px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.card-platform{
  font-size:9px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  font-weight:600;
}

.card-schedule-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.sched-label{
  font-size:9px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--dim);
}

.card-date-input{
  background:transparent;
  border:none;
  border-bottom:0.5px solid transparent;
  color:var(--muted);
  font-family:var(--font);
  font-size:10px;
  outline:none;
  padding:2px 4px;
  cursor:pointer;
  transition:border-color 0.15s;
  color-scheme:dark;
}

.card-date-input:hover,
.card-date-input:focus{
  border-bottom-color:var(--border);
}

.card-date-input::-webkit-calendar-picker-indicator{
  filter:invert(0.35);
  cursor:pointer;
  width:11px;height:11px;
}

.card-body{ padding:16px; }

.card-textarea{
  width:100%;
  background:transparent;
  border:none;
  color:var(--text);
  font-family:var(--font);
  font-size:13px;
  line-height:1.75;
  resize:vertical;
  min-height:100px;
  outline:none;
  padding:0;
}

.card-footer{
  padding:11px 16px;
  border-top:0.5px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.card-ts{
  font-size:9px;
  color:var(--dim);
  letter-spacing:0.04em;
}

.card-actions{ display:flex; gap:8px; }

/* CEO review card: slight tint on header */
.card.in-review .card-header{
  background:rgba(255,255,255,0.012);
}

/* ── POSTED LIST ─────────────────────────────────────── */
.posted-col-heads{
  display:grid;
  grid-template-columns:160px 150px 1fr 70px;
  gap:16px;
  padding:0 0 11px;
  border-bottom:0.5px solid var(--border);
}

.posted-col-heads span{
  font-size:9px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--dim);
}

.posted-item{
  display:grid;
  grid-template-columns:160px 150px 1fr 70px;
  gap:16px;
  padding:13px 0;
  border-bottom:0.5px solid var(--border);
  align-items:center;
  animation:cardIn 0.4s var(--ease) both;
}

.posted-platform{
  font-size:9px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--muted);
}

.posted-date{
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

.posted-excerpt{
  font-size:12px;
  color:rgba(255,255,255,0.7);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.posted-badge{
  font-size:9px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--dim);
  text-align:right;
}

/* ── EMPTY ───────────────────────────────────────────── */
.empty{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:80px 0;
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--dim);
}

/* ── OVERLAY / MODAL ─────────────────────────────────── */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(8,8,8,0.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.overlay.open{ display:flex; }

.modal-box{
  border:0.5px solid rgba(255,255,255,0.16);
  background:#0e0e0e;
  padding:32px 36px;
  width:420px;
  animation:cardIn 0.3s var(--ease) both;
}

.modal-title{
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  margin-bottom:8px;
}

.modal-sub{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
  margin-bottom:24px;
}

.modal-field{ margin-bottom:20px; }

.modal-field-label{
  display:block;
  font-size:9px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:7px;
}

.modal-input{
  width:100%;
  background:transparent;
  border:0.5px solid var(--border);
  color:var(--text);
  font-family:var(--font);
  font-size:13px;
  padding:10px 12px;
  outline:none;
  border-radius:0;
  transition:border-color 0.15s;
}

.modal-input:focus{ border-color:rgba(255,255,255,0.35); }

.modal-hint{
  font-size:10px;
  color:var(--dim);
  margin-top:6px;
  letter-spacing:0.02em;
}

.modal-actions{ display:flex; gap:10px; margin-top:8px; }

/* ── TOAST ───────────────────────────────────────────── */
.toast{
  position:fixed;
  bottom:24px;
  right:24px;
  background:#ffffff;
  color:#080808;
  font-family:var(--font);
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  padding:11px 20px;
  z-index:200;
  opacity:0;
  transform:translateY(6px);
  transition:opacity 0.2s var(--ease),transform 0.2s var(--ease);
  pointer-events:none;
}
.toast.show{ opacity:1;transform:none; }

/* ── SCROLLBAR ───────────────────────────────────────── */
::-webkit-scrollbar{ width:3px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.08); }
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────── -->
<header class="header">
  <div class="header-left">
    <a class="header-ws" href="/workspace">VHP Workspace</a>
    <span class="header-sep">/</span>
    <span class="header-module">Marketing</span>
  </div>
  <div class="header-right">
    <a class="header-nav-link" href="/dashboard">Mandates</a>
    <button class="header-settings-btn" onclick="openSettings()">Settings</button>
    <span id="clock">—</span>
  </div>
</header>

<!-- ── LAYOUT ─────────────────────────────────────────── -->
<div class="layout">

  <!-- FORM PANEL -->
  <aside class="form-panel">
    <div class="panel-eyebrow">New Submission</div>

    <div class="field">
      <label class="field-label">Platform</label>
      <div class="select-wrap">
        <select id="f-platform">
          <option value="LINKEDIN POST">LinkedIn Post</option>
          <option value="LINKEDIN CAROUSEL">LinkedIn Carousel</option>
          <option value="X POST">X Post</option>
          <option value="X THREAD">X Thread</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Content</label>
      <textarea id="f-content" placeholder="Paste content here…"></textarea>
    </div>

    <div class="field">
      <label class="field-label">Scheduled Send · SAST</label>
      <input type="datetime-local" id="f-datetime">
    </div>

    <div class="rule"></div>

    <button class="btn btn-primary btn-full" onclick="submitContent()">Submit to Review</button>

    <!-- WhatsApp status strip -->
    <div class="wa-status" id="wa-status" style="display:none">
      <span class="wa-label">CEO WhatsApp</span>
      <span class="wa-number" id="wa-number-display">—</span>
      <span class="wa-configure" onclick="openSettings()">Change</span>
    </div>
    <div class="wa-status" id="wa-setup" style="display:none">
      <span class="wa-label">CEO WhatsApp</span>
      <span class="wa-configure" onclick="openSettings()">Configure →</span>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <main class="main-area">

    <!-- TABS -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="pending" onclick="switchTab('pending')">
        Pending <span class="badge" id="badge-pending">0</span>
      </button>
      <button class="tab-btn" data-tab="ceo" onclick="switchTab('ceo')">
        CEO Review <span class="badge" id="badge-ceo">0</span>
      </button>
      <button class="tab-btn" data-tab="posted" onclick="switchTab('posted')">
        Posted <span class="badge" id="badge-posted">0</span>
      </button>
    </nav>

    <!-- PENDING TAB -->
    <div id="tab-pending" class="tab-panel active">
      <div class="cards" id="cards-pending"></div>
    </div>

    <!-- CEO REVIEW TAB -->
    <div id="tab-ceo" class="tab-panel">
      <div class="cards" id="cards-ceo"></div>
    </div>

    <!-- POSTED TAB -->
    <div id="tab-posted" class="tab-panel">
      <div id="posted-list"></div>
    </div>

  </main>
</div>

<!-- ── CONFIRM / SETTINGS OVERLAY ─────────────────────── -->
<div class="overlay" id="overlay">
  <div class="modal-box" id="modal-box">
    <!-- content injected by JS -->
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
// ── STORAGE ────────────────────────────────────────────────────
const K = {
  pending:  'vhp:pending',
  ceo:      'vhp:ceo',
  posted:   'vhp:posted',
  ceoPhone: 'vhp:ceoPhone'
};

function load(key){ try{ return JSON.parse(localStorage.getItem(key))||[]; }catch{ return []; } }
function save(key,data){ localStorage.setItem(key,JSON.stringify(data)); }
function loadStr(key){ return localStorage.getItem(key)||''; }

// ── STATE ──────────────────────────────────────────────────────
let pending = load(K.pending);
let ceo     = load(K.ceo);
let posted  = load(K.posted);
let overlayMode = null; // 'confirm' | 'settings'
let confirmCb   = null;

// ── ID ─────────────────────────────────────────────────────────
function genId(){
  const d = new Date();
  const date = d.toISOString().slice(0,10).replace(/-/g,'');
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `${date}-${rand}`;
}

// ── TIME ───────────────────────────────────────────────────────
function fmt(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('en-ZA',{
    day:'2-digit',month:'short',year:'numeric',
    hour:'2-digit',minute:'2-digit',hour12:false
  });
}

function fmtShort(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'});
}

function toLocalInput(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── CLOCK ──────────────────────────────────────────────────────
(function tick(){
  const d = new Date();
  const sast = new Date(d.getTime() + 2*3600000);
  const p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${p(sast.getUTCHours())}:${p(sast.getUTCMinutes())}:${p(sast.getUTCSeconds())} SAST`;
  setTimeout(tick, 1000);
})();

// ── TOAST ──────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2800);
}

// ── WHATSAPP NUMBER STATE ──────────────────────────────────────
function updateWaStrip(){
  const phone = loadStr(K.ceoPhone);
  const hasPh = phone && phone.length >= 7;
  document.getElementById('wa-status').style.display = hasPh ? '' : 'none';
  document.getElementById('wa-setup').style.display  = hasPh ? 'none' : '';
  if(hasPh){
    const masked = '+' + phone.slice(0,2) + ' ' + phone.slice(2,4) + '• '.repeat(4) + phone.slice(-2);
    document.getElementById('wa-number-display').textContent = masked;
  }
}

// ── WHATSAPP SEND ──────────────────────────────────────────────
function sendWhatsApp(item){
  const phone = loadStr(K.ceoPhone);
  if(!phone){ toast('No CEO number set. Open Settings.'); return; }

  const platform  = item.platform;
  const sched     = item.scheduledAt ? fmt(item.scheduledAt) : 'TBC';
  const preview   = item.content.length > 600
    ? item.content.slice(0,600) + '…'
    : item.content;

  const msg =
    `*VHP — Content Review*\n\n` +
    `Platform: ${platform}\n` +
    `Scheduled: ${sched} SAST\n\n` +
    `───────────────────────\n` +
    `${preview}\n` +
    `───────────────────────\n\n` +
    `Review at vonhartmannpartners.co.za/marketing`;

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
}

// ── OVERLAY HELPERS ────────────────────────────────────────────
function closeOverlay(){
  document.getElementById('overlay').classList.remove('open');
  overlayMode = null;
  confirmCb   = null;
}

document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target === e.currentTarget) closeOverlay();
});

// ── CONFIRM DIALOG ─────────────────────────────────────────────
function openConfirm(title, body, onYes){
  overlayMode = 'confirm';
  confirmCb   = onYes;
  document.getElementById('modal-box').innerHTML = `
    <div class="modal-title">${esc(title)}</div>
    <div class="modal-sub">${esc(body)}</div>
    <div class="modal-actions">
      <button class="btn btn-sm btn-primary" id="confirm-ok">Confirm</button>
      <button class="btn btn-sm btn-ghost" onclick="closeOverlay()">Cancel</button>
    </div>
  `;
  document.getElementById('confirm-ok').onclick = ()=>{
    if(confirmCb) confirmCb();
    closeOverlay();
  };
  document.getElementById('overlay').classList.add('open');
}

// ── SETTINGS MODAL ─────────────────────────────────────────────
function openSettings(){
  overlayMode = 'settings';
  const current = loadStr(K.ceoPhone);
  document.getElementById('modal-box').innerHTML = `
    <div class="modal-title">Settings</div>
    <div class="modal-sub">Configure CEO WhatsApp number. Used to send content for review directly to WhatsApp.</div>
    <div class="modal-field">
      <label class="modal-field-label">CEO WhatsApp Number</label>
      <input class="modal-input" id="settings-phone" type="tel"
        placeholder="e.g. 27821234567"
        value="${esc(current)}">
      <div class="modal-hint">International format, no spaces or + sign. South Africa: 27XXXXXXXXX</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-sm btn-primary" onclick="saveSettings()">Save</button>
      <button class="btn btn-sm btn-ghost" onclick="closeOverlay()">Cancel</button>
      ${current ? `<button class="btn btn-sm btn-ghost" style="margin-left:auto" onclick="clearSettings()">Clear</button>` : ''}
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>{ const el = document.getElementById('settings-phone'); if(el) el.focus(); }, 50);
}

function saveSettings(){
  const raw = (document.getElementById('settings-phone').value||'').replace(/[^0-9]/g,'');
  if(raw.length < 7){ toast('Enter a valid number'); return; }
  localStorage.setItem(K.ceoPhone, raw);
  updateWaStrip();
  closeOverlay();
  toast('CEO WhatsApp saved');
}

function clearSettings(){
  localStorage.removeItem(K.ceoPhone);
  updateWaStrip();
  closeOverlay();
  toast('Number cleared');
}

// ── TABS ───────────────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`tab-${tab}`));
}

// ── BADGES ────────────────────────────────────────────────────
function updateBadges(){
  document.getElementById('badge-pending').textContent = pending.length;
  document.getElementById('badge-ceo').textContent     = ceo.length;
  document.getElementById('badge-posted').textContent  = posted.length;
}

// ── HTML ESCAPE ───────────────────────────────────────────────
function esc(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INLINE SAVE ───────────────────────────────────────────────
function saveField(id,field,value,store,storeKey){
  const item = store.find(i=>i.id===id);
  if(item){ item[field]=value; save(storeKey,store); }
}

// ── SUBMIT ────────────────────────────────────────────────────
function submitContent(){
  const platform = document.getElementById('f-platform').value;
  const content  = document.getElementById('f-content').value.trim();
  const dt       = document.getElementById('f-datetime').value;
  if(!content){ toast('Content required'); return; }
  const item = {
    id:          genId(),
    platform,
    content,
    scheduledAt: dt ? new Date(dt).toISOString() : null,
    createdAt:   new Date().toISOString()
  };
  pending.unshift(item);
  save(K.pending, pending);
  document.getElementById('f-content').value  = '';
  document.getElementById('f-datetime').value = '';
  renderPending();
  updateBadges();
  switchTab('pending');
  toast('Submitted to review');
}

// ── SEND TO CEO ───────────────────────────────────────────────
function sendToCeo(id){
  const idx = pending.findIndex(i=>i.id===id);
  if(idx===-1) return;
  const item = { ...pending[idx], sentAt: new Date().toISOString() };
  pending.splice(idx,1);
  ceo.unshift(item);
  save(K.pending, pending);
  save(K.ceo, ceo);
  renderPending();
  renderCeo();
  updateBadges();

  // Auto-open WhatsApp if number configured
  const phone = loadStr(K.ceoPhone);
  if(phone){
    toast('Sent to CEO Review — opening WhatsApp…');
    setTimeout(()=>sendWhatsApp(item), 400);
  } else {
    toast('Sent to CEO Review. Configure WhatsApp in Settings to notify automatically.');
  }
}

// ── SEND WHATSAPP AGAIN (from CEO review card) ─────────────────
function resendWhatsApp(id){
  const item = ceo.find(i=>i.id===id);
  if(!item) return;
  sendWhatsApp(item);
}

// ── RETURN TO PENDING ──────────────────────────────────────────
function returnPending(id){
  const idx = ceo.findIndex(i=>i.id===id);
  if(idx===-1) return;
  const item = { ...ceo[idx] };
  delete item.sentAt;
  ceo.splice(idx,1);
  pending.unshift(item);
  save(K.ceo, ceo);
  save(K.pending, pending);
  renderCeo();
  renderPending();
  updateBadges();
  toast('Returned to pending');
}

// ── APPROVE → POSTED ──────────────────────────────────────────
function approvePost(id){
  const idx = ceo.findIndex(i=>i.id===id);
  if(idx===-1) return;
  const item = { ...ceo[idx], approvedAt: new Date().toISOString() };
  delete item.sentAt;
  ceo.splice(idx,1);
  posted.unshift(item);
  save(K.ceo, ceo);
  save(K.posted, posted);
  renderCeo();
  renderPosted();
  updateBadges();
  toast('Approved — marked as posted');
}

// ── DISCARD ───────────────────────────────────────────────────
function discard(id, store, storeKey, renderFn){
  openConfirm(
    'Discard Content',
    'This will permanently remove the item from the pipeline. This cannot be undone.',
    ()=>{
      const idx = store.findIndex(i=>i.id===id);
      if(idx>-1){ store.splice(idx,1); save(storeKey,store); }
      renderFn();
      updateBadges();
      toast('Discarded');
    }
  );
}

// ── RENDER PENDING ────────────────────────────────────────────
function renderPending(){
  const el = document.getElementById('cards-pending');
  if(!pending.length){
    el.innerHTML = '<div class="empty">No pending items</div>';
    return;
  }
  el.innerHTML = pending.map((item,i)=>`
    <div class="card" style="animation-delay:${i*45}ms">
      <div class="card-header">
        <span class="card-platform">${esc(item.platform)}</span>
        <div class="card-schedule-row">
          <span class="sched-label">Scheduled</span>
          <input type="datetime-local" class="card-date-input"
            value="${item.scheduledAt?toLocalInput(item.scheduledAt):''}"
            onchange="saveField('${item.id}','scheduledAt',this.value?new Date(this.value).toISOString():null,pending,'${K.pending}')">
        </div>
      </div>
      <div class="card-body">
        <textarea class="card-textarea" rows="5"
          onchange="saveField('${item.id}','content',this.value,pending,'${K.pending}')"
          >${esc(item.content)}</textarea>
      </div>
      <div class="card-footer">
        <span class="card-ts">Created ${fmt(item.createdAt)}</span>
        <div class="card-actions">
          <button class="btn btn-sm btn-ghost" onclick="discard('${item.id}',pending,'${K.pending}',renderPending)">Discard</button>
          <button class="btn btn-sm btn-primary" onclick="sendToCeo('${item.id}')">Send to CEO</button>
        </div>
      </div>
    </div>
  `).join('');
}

// ── RENDER CEO REVIEW ─────────────────────────────────────────
function renderCeo(){
  const el = document.getElementById('cards-ceo');
  if(!ceo.length){
    el.innerHTML = '<div class="empty">Nothing awaiting CEO review</div>';
    return;
  }
  el.innerHTML = ceo.map((item,i)=>`
    <div class="card in-review" style="animation-delay:${i*45}ms">
      <div class="card-header">
        <span class="card-platform">${esc(item.platform)}</span>
        <div class="card-schedule-row">
          <span class="sched-label">Scheduled</span>
          <input type="datetime-local" class="card-date-input"
            value="${item.scheduledAt?toLocalInput(item.scheduledAt):''}"
            onchange="saveField('${item.id}','scheduledAt',this.value?new Date(this.value).toISOString():null,ceo,'${K.ceo}')">
        </div>
      </div>
      <div class="card-body">
        <textarea class="card-textarea" rows="5"
          onchange="saveField('${item.id}','content',this.value,ceo,'${K.ceo}')"
          >${esc(item.content)}</textarea>
      </div>
      <div class="card-footer">
        <span class="card-ts">Sent ${fmt(item.sentAt)}</span>
        <div class="card-actions">
          <button class="btn btn-sm btn-ghost" onclick="resendWhatsApp('${item.id}')">↗ WhatsApp</button>
          <button class="btn btn-sm btn-ghost" onclick="returnPending('${item.id}')">Return</button>
          <button class="btn btn-sm btn-ghost" onclick="discard('${item.id}',ceo,'${K.ceo}',renderCeo)">Discard</button>
          <button class="btn btn-sm btn-primary" onclick="approvePost('${item.id}')">Approve &amp; Post</button>
        </div>
      </div>
    </div>
  `).join('');
}

// ── RENDER POSTED ─────────────────────────────────────────────
function renderPosted(){
  const el = document.getElementById('posted-list');
  if(!posted.length){
    el.innerHTML = '<div class="empty">No posted content</div>';
    return;
  }
  const rows = posted.map((item,i)=>`
    <div class="posted-item" style="animation-delay:${i*28}ms">
      <span class="posted-platform">${esc(item.platform)}</span>
      <span class="posted-date">${fmtShort(item.approvedAt)}</span>
      <span class="posted-excerpt">${esc((item.content||'').slice(0,120))}</span>
      <span class="posted-badge">Posted</span>
    </div>
  `).join('');
  el.innerHTML = `
    <div class="posted-col-heads">
      <span>Platform</span><span>Date Posted</span><span>Content</span><span></span>
    </div>
    ${rows}
  `;
}

// ── INIT ──────────────────────────────────────────────────────
renderPending();
renderCeo();
renderPosted();
updateBadges();
updateWaStrip();
</script>
</body>
</html>
