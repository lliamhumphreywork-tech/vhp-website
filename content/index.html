<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHP · Content</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#080808;
  --surface:#0e0e0e;
  --border:rgba(255,255,255,0.11);
  --text:#ffffff;
  --muted:#999999;
  --dim:#555555;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:13px;
  line-height:1.5;
  height:100%;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ─── ENTRY ANIMATIONS ─────────────────────────────── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ─── HEADER ────────────────────────────────────────── */
.header{
  height:50px;
  border-bottom:0.5px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:50;
  animation:fadeIn 0.5s var(--ease) both;
}

.header-wordmark{
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  font-weight:500;
  color:var(--text);
}

.header-right{
  display:flex;
  align-items:center;
  gap:28px;
}

.header-system{
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--dim);
}

#clock{
  font-size:11px;
  letter-spacing:0.06em;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

/* ─── LAYOUT ─────────────────────────────────────────── */
.layout{
  display:grid;
  grid-template-columns:304px 1fr;
  height:calc(100vh - 50px);
}

/* ─── FORM PANEL ─────────────────────────────────────── */
.form-panel{
  border-right:0.5px solid var(--border);
  padding:26px 22px;
  overflow-y:auto;
  animation:fadeUp 0.6s var(--ease) 0.06s both;
}

.panel-eyebrow{
  font-size:9px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--dim);
  margin-bottom:22px;
}

.field{margin-bottom:14px;}

.field-label{
  display:block;
  font-size:9px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}

.field select,
.field input[type="datetime-local"],
.field textarea{
  width:100%;
  background:transparent;
  border:0.5px solid var(--border);
  color:var(--text);
  font-family:var(--font);
  font-size:12px;
  padding:9px 11px;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  border-radius:0;
  transition:border-color 0.15s;
}

.field select:focus,
.field input:focus,
.field textarea:focus{
  border-color:rgba(255,255,255,0.35);
}

.field textarea{
  resize:vertical;
  min-height:168px;
  line-height:1.7;
  color:var(--text);
}

.field textarea::placeholder{
  color:var(--dim);
  font-size:12px;
}

.field select option{background:#111;color:#fff;}

.select-wrap{position:relative;}
.select-wrap::after{
  content:'▾';
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  color:var(--dim);
  font-size:10px;
  pointer-events:none;
}

.field input[type="datetime-local"]{
  color-scheme:dark;
}

.field input[type="datetime-local"]::-webkit-calendar-picker-indicator{
  filter:invert(0.4);
  cursor:pointer;
}

.rule{
  height:0.5px;
  background:var(--border);
  margin:10px 0 20px;
}

/* ─── BUTTONS ────────────────────────────────────────── */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 18px;
  font-family:var(--font);
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  cursor:pointer;
  border:0.5px solid rgba(255,255,255,0.4);
  background:transparent;
  color:var(--text);
  transition:background 0.12s,color 0.12s,border-color 0.12s;
  border-radius:0;
  white-space:nowrap;
  user-select:none;
}

.btn:hover{
  background:#ffffff;
  color:#080808;
  border-color:#ffffff;
}

.btn-primary{
  background:#ffffff;
  color:#080808;
  border-color:#ffffff;
}
.btn-primary:hover{
  background:#e0e0e0;
  border-color:#e0e0e0;
}

.btn-full{width:100%;}

.btn-sm{
  padding:7px 13px;
  font-size:9px;
  letter-spacing:0.1em;
}

.btn-ghost{
  border-color:rgba(255,255,255,0.12);
  color:var(--muted);
}
.btn-ghost:hover{
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border-color:rgba(255,255,255,0.22);
}

/* ─── MAIN AREA ──────────────────────────────────────── */
.main-area{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  animation:fadeUp 0.65s var(--ease) 0.12s both;
}

/* ─── TABS ───────────────────────────────────────────── */
.tabs{
  border-bottom:0.5px solid var(--border);
  padding:0 28px;
  display:flex;
  gap:0;
  flex-shrink:0;
}

.tab-btn{
  padding:14px 18px;
  font-size:10px;
  letter-spacing:0.13em;
  text-transform:uppercase;
  color:var(--muted);
  cursor:pointer;
  border:none;
  background:transparent;
  font-family:var(--font);
  border-bottom:1px solid transparent;
  margin-bottom:-0.5px;
  transition:color 0.15s;
  display:flex;
  align-items:center;
  gap:8px;
  border-radius:0;
}

.tab-btn:hover{color:rgba(255,255,255,0.65);}

.tab-btn.active{
  color:var(--text);
  border-bottom-color:var(--text);
}

.badge{
  display:inline-block;
  font-size:9px;
  font-family:var(--font);
  font-weight:normal;
  padding:2px 7px;
  background:rgba(255,255,255,0.07);
  color:var(--dim);
  letter-spacing:0;
  border-radius:1px;
  transition:background 0.15s,color 0.15s;
}

.tab-btn.active .badge{
  background:#ffffff;
  color:#080808;
}

/* ─── TAB PANELS ─────────────────────────────────────── */
.tab-panel{
  display:none;
  overflow-y:auto;
  flex:1;
  padding:24px 28px;
}
.tab-panel.active{display:block;}

/* ─── CARDS ──────────────────────────────────────────── */
.cards{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.card{
  border:0.5px solid var(--border);
  background:var(--bg);
  animation:cardIn 0.5s var(--ease) both;
}

.card-header{
  padding:12px 16px;
  border-bottom:0.5px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.card-platform{
  font-size:9px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--text);
}

.card-schedule-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.sched-label{
  font-size:9px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--dim);
}

.card-date-input{
  background:transparent;
  border:none;
  border-bottom:0.5px solid transparent;
  color:var(--muted);
  font-family:var(--font);
  font-size:10px;
  letter-spacing:0.03em;
  outline:none;
  padding:2px 4px;
  cursor:pointer;
  transition:border-color 0.15s;
  color-scheme:dark;
}

.card-date-input:hover,
.card-date-input:focus{
  border-bottom-color:rgba(255,255,255,0.18);
}

.card-date-input::-webkit-calendar-picker-indicator{
  filter:invert(0.35);
  cursor:pointer;
  width:11px;
  height:11px;
}

.card-body{padding:16px;}

.card-textarea{
  width:100%;
  background:transparent;
  border:none;
  color:var(--text);
  font-family:var(--font);
  font-size:13px;
  line-height:1.75;
  resize:vertical;
  min-height:100px;
  outline:none;
  padding:0;
}

.card-footer{
  padding:11px 16px;
  border-top:0.5px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.card-ts{
  font-size:9px;
  color:var(--dim);
  letter-spacing:0.04em;
}

.card-actions{
  display:flex;
  gap:8px;
}

/* CEO Review — locked state */
.card.in-review .card-textarea{
  color:rgba(255,255,255,0.7);
}

.card.in-review .card-header{
  background:rgba(255,255,255,0.015);
}

/* ─── POSTED LIST ────────────────────────────────────── */
.posted-col-heads{
  display:grid;
  grid-template-columns:160px 150px 1fr 70px;
  gap:16px;
  padding:0 0 11px;
  border-bottom:0.5px solid var(--border);
}

.posted-col-heads span{
  font-size:9px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--dim);
}

.posted-item{
  display:grid;
  grid-template-columns:160px 150px 1fr 70px;
  gap:16px;
  padding:13px 0;
  border-bottom:0.5px solid var(--border);
  align-items:center;
  animation:cardIn 0.4s var(--ease) both;
}

.posted-platform{
  font-size:9px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--muted);
}

.posted-date{
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

.posted-excerpt{
  font-size:12px;
  color:rgba(255,255,255,0.75);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.posted-badge{
  font-size:9px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--dim);
  text-align:right;
}

/* ─── EMPTY STATE ────────────────────────────────────── */
.empty{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:80px 0;
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--dim);
}

/* ─── CONFIRM OVERLAY ────────────────────────────────── */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(8,8,8,0.86);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.overlay.open{display:flex;}

.confirm-box{
  border:0.5px solid rgba(255,255,255,0.18);
  background:#0e0e0e;
  padding:32px 36px;
  width:380px;
  animation:cardIn 0.3s var(--ease) both;
}

.confirm-title{
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  margin-bottom:12px;
  color:var(--text);
}

.confirm-body{
  font-size:13px;
  color:var(--muted);
  line-height:1.65;
  margin-bottom:28px;
}

.confirm-btns{display:flex;gap:10px;}

/* ─── TOAST ──────────────────────────────────────────── */
.toast{
  position:fixed;
  bottom:24px;
  right:24px;
  background:#ffffff;
  color:#080808;
  font-family:var(--font);
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  padding:11px 20px;
  z-index:200;
  opacity:0;
  transform:translateY(6px);
  transition:opacity 0.2s var(--ease),transform 0.2s var(--ease);
  pointer-events:none;
}
.toast.show{opacity:1;transform:none;}

/* ─── SCROLLBAR ──────────────────────────────────────── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);}
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────── -->
<header class="header">
  <div class="header-wordmark">Von Hartmann &amp; Partners · Content</div>
  <div class="header-right">
    <span class="header-system">Content Review System</span>
    <span id="clock">—</span>
  </div>
</header>

<!-- ── LAYOUT ─────────────────────────────────────────── -->
<div class="layout">

  <!-- FORM PANEL -->
  <aside class="form-panel">
    <div class="panel-eyebrow">New Submission</div>

    <div class="field">
      <label class="field-label">Platform</label>
      <div class="select-wrap">
        <select id="f-platform">
          <option value="LINKEDIN POST">LinkedIn Post</option>
          <option value="LINKEDIN CAROUSEL">LinkedIn Carousel</option>
          <option value="X POST">X Post</option>
          <option value="X THREAD">X Thread</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Content</label>
      <textarea id="f-content" placeholder="Paste content here…"></textarea>
    </div>

    <div class="field">
      <label class="field-label">Scheduled Send · SAST</label>
      <input type="datetime-local" id="f-datetime">
    </div>

    <div class="rule"></div>

    <button class="btn btn-primary btn-full" onclick="submitContent()">Submit to Review</button>
  </aside>

  <!-- MAIN AREA -->
  <main class="main-area">

    <!-- TABS -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="pending" onclick="switchTab('pending')">
        Pending <span class="badge" id="badge-pending">0</span>
      </button>
      <button class="tab-btn" data-tab="ceo" onclick="switchTab('ceo')">
        CEO Review <span class="badge" id="badge-ceo">0</span>
      </button>
      <button class="tab-btn" data-tab="posted" onclick="switchTab('posted')">
        Posted <span class="badge" id="badge-posted">0</span>
      </button>
    </nav>

    <!-- PENDING -->
    <div id="tab-pending" class="tab-panel active">
      <div class="cards" id="cards-pending"></div>
    </div>

    <!-- CEO REVIEW -->
    <div id="tab-ceo" class="tab-panel">
      <div class="cards" id="cards-ceo"></div>
    </div>

    <!-- POSTED -->
    <div id="tab-posted" class="tab-panel">
      <div id="posted-list"></div>
    </div>

  </main>
</div>

<!-- ── CONFIRM ─────────────────────────────────────────── -->
<div class="overlay" id="overlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirm-title">Confirm</div>
    <div class="confirm-body" id="confirm-body">Are you sure?</div>
    <div class="confirm-btns">
      <button class="btn btn-sm btn-primary" id="confirm-ok">Confirm</button>
      <button class="btn btn-sm btn-ghost" onclick="closeConfirm()">Cancel</button>
    </div>
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
// ── STORAGE KEYS ───────────────────────────────────────────────────
const K = {
  pending: 'vhp:pending',
  ceo:     'vhp:ceo',
  posted:  'vhp:posted'
};

// ── LOAD / SAVE ────────────────────────────────────────────────────
function load(key){ try{ return JSON.parse(localStorage.getItem(key))||[]; }catch{ return []; } }
function save(key,data){ localStorage.setItem(key,JSON.stringify(data)); }

// ── STATE ──────────────────────────────────────────────────────────
let pending = load(K.pending);
let ceo     = load(K.ceo);
let posted  = load(K.posted);
let confirmCb = null;

// ── ID ─────────────────────────────────────────────────────────────
function genId(){
  const d = new Date();
  const date = d.toISOString().slice(0,10).replace(/-/g,'');
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `${date}-${rand}`;
}

// ── TIME UTILS ─────────────────────────────────────────────────────
function fmt(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('en-ZA',{
    day:'2-digit', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit', hour12:false
  });
}

function fmtShort(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('en-ZA',{
    day:'2-digit', month:'short', year:'numeric'
  });
}

// datetime-local input needs local ISO (YYYY-MM-DDTHH:MM)
function toLocalInput(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── CLOCK (SAST = UTC+2) ───────────────────────────────────────────
(function tick(){
  const d = new Date();
  const sast = new Date(d.getTime() + 2*3600000);
  const h = sast.getUTCHours().toString().padStart(2,'0');
  const m = sast.getUTCMinutes().toString().padStart(2,'0');
  const s = sast.getUTCSeconds().toString().padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s} SAST`;
  setTimeout(tick, 1000);
})();

// ── TOAST ──────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2800);
}

// ── CONFIRM ────────────────────────────────────────────────────────
function confirm(title, body, onYes){
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent = body;
  confirmCb = onYes;
  document.getElementById('overlay').classList.add('open');
}

function closeConfirm(){
  document.getElementById('overlay').classList.remove('open');
  confirmCb = null;
}

document.getElementById('confirm-ok').addEventListener('click',()=>{
  if(confirmCb) confirmCb();
  closeConfirm();
});

document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target===e.currentTarget) closeConfirm();
});

// ── TABS ───────────────────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`tab-${tab}`));
}

// ── BADGES ────────────────────────────────────────────────────────
function updateBadges(){
  document.getElementById('badge-pending').textContent = pending.length;
  document.getElementById('badge-ceo').textContent     = ceo.length;
  document.getElementById('badge-posted').textContent  = posted.length;
}

// ── HTML ESCAPE ───────────────────────────────────────────────────
function esc(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── SUBMIT ────────────────────────────────────────────────────────
function submitContent(){
  const platform = document.getElementById('f-platform').value;
  const content  = document.getElementById('f-content').value.trim();
  const dt       = document.getElementById('f-datetime').value;
  if(!content){ toast('Content required'); return; }
  const item = {
    id:          genId(),
    platform,
    content,
    scheduledAt: dt ? new Date(dt).toISOString() : null,
    createdAt:   new Date().toISOString()
  };
  pending.unshift(item);
  save(K.pending, pending);
  document.getElementById('f-content').value   = '';
  document.getElementById('f-datetime').value  = '';
  renderPending();
  updateBadges();
  switchTab('pending');
  toast('Submitted to review');
}

// ── INLINE SAVE ───────────────────────────────────────────────────
function saveField(id, field, value, store, storeKey){
  const item = store.find(i=>i.id===id);
  if(item){ item[field] = value; save(storeKey, store); }
}

// ── SEND TO CEO ───────────────────────────────────────────────────
function sendToCeo(id){
  const idx = pending.findIndex(i=>i.id===id);
  if(idx===-1) return;
  const item = { ...pending[idx], sentAt: new Date().toISOString() };
  pending.splice(idx,1);
  ceo.unshift(item);
  save(K.pending, pending);
  save(K.ceo, ceo);
  renderPending();
  renderCeo();
  updateBadges();
  toast('Sent to CEO review');
}

// ── RETURN TO PENDING ─────────────────────────────────────────────
function returnPending(id){
  const idx = ceo.findIndex(i=>i.id===id);
  if(idx===-1) return;
  const item = { ...ceo[idx] };
  delete item.sentAt;
  ceo.splice(idx,1);
  pending.unshift(item);
  save(K.ceo, ceo);
  save(K.pending, pending);
  renderCeo();
  renderPending();
  updateBadges();
  toast('Returned to pending');
}

// ── APPROVE → POSTED ──────────────────────────────────────────────
function approvePost(id){
  const idx = ceo.findIndex(i=>i.id===id);
  if(idx===-1) return;
  const item = { ...ceo[idx], approvedAt: new Date().toISOString() };
  delete item.sentAt;
  ceo.splice(idx,1);
  posted.unshift(item);
  save(K.ceo, ceo);
  save(K.posted, posted);
  renderCeo();
  renderPosted();
  updateBadges();
  toast('Approved — marked as posted');
}

// ── DISCARD ───────────────────────────────────────────────────────
function discard(id, store, storeKey, renderFn){
  confirm(
    'Discard Content',
    'This will permanently remove the item from the pipeline. This cannot be undone.',
    ()=>{
      const idx = store.findIndex(i=>i.id===id);
      if(idx>-1){ store.splice(idx,1); save(storeKey,store); }
      renderFn();
      updateBadges();
      toast('Discarded');
    }
  );
}

// ── RENDER PENDING ────────────────────────────────────────────────
function renderPending(){
  const el = document.getElementById('cards-pending');
  if(!pending.length){
    el.innerHTML = '<div class="empty">No pending items</div>';
    return;
  }
  el.innerHTML = pending.map((item,i)=>`
    <div class="card" style="animation-delay:${i*45}ms">
      <div class="card-header">
        <span class="card-platform">${esc(item.platform)}</span>
        <div class="card-schedule-row">
          <span class="sched-label">Scheduled</span>
          <input type="datetime-local" class="card-date-input"
            value="${item.scheduledAt?toLocalInput(item.scheduledAt):''}"
            onchange="saveField('${item.id}','scheduledAt',this.value?new Date(this.value).toISOString():null,pending,'${K.pending}')">
        </div>
      </div>
      <div class="card-body">
        <textarea class="card-textarea" rows="5"
          onchange="saveField('${item.id}','content',this.value,pending,'${K.pending}')"
          >${esc(item.content)}</textarea>
      </div>
      <div class="card-footer">
        <span class="card-ts">Created ${fmt(item.createdAt)}</span>
        <div class="card-actions">
          <button class="btn btn-sm btn-ghost" onclick="discard('${item.id}',pending,'${K.pending}',renderPending)">Discard</button>
          <button class="btn btn-sm btn-primary" onclick="sendToCeo('${item.id}')">Send to CEO</button>
        </div>
      </div>
    </div>
  `).join('');
}

// ── RENDER CEO REVIEW ─────────────────────────────────────────────
function renderCeo(){
  const el = document.getElementById('cards-ceo');
  if(!ceo.length){
    el.innerHTML = '<div class="empty">Nothing awaiting CEO review</div>';
    return;
  }
  el.innerHTML = ceo.map((item,i)=>`
    <div class="card in-review" style="animation-delay:${i*45}ms">
      <div class="card-header">
        <span class="card-platform">${esc(item.platform)}</span>
        <div class="card-schedule-row">
          <span class="sched-label">Scheduled</span>
          <input type="datetime-local" class="card-date-input"
            value="${item.scheduledAt?toLocalInput(item.scheduledAt):''}"
            onchange="saveField('${item.id}','scheduledAt',this.value?new Date(this.value).toISOString():null,ceo,'${K.ceo}')">
        </div>
      </div>
      <div class="card-body">
        <textarea class="card-textarea" rows="5"
          onchange="saveField('${item.id}','content',this.value,ceo,'${K.ceo}')"
          >${esc(item.content)}</textarea>
      </div>
      <div class="card-footer">
        <span class="card-ts">Sent for review ${fmt(item.sentAt)}</span>
        <div class="card-actions">
          <button class="btn btn-sm btn-ghost" onclick="returnPending('${item.id}')">Return</button>
          <button class="btn btn-sm btn-ghost" onclick="discard('${item.id}',ceo,'${K.ceo}',renderCeo)">Discard</button>
          <button class="btn btn-sm btn-primary" onclick="approvePost('${item.id}')">Approve &amp; Post</button>
        </div>
      </div>
    </div>
  `).join('');
}

// ── RENDER POSTED ─────────────────────────────────────────────────
function renderPosted(){
  const el = document.getElementById('posted-list');
  if(!posted.length){
    el.innerHTML = '<div class="empty">No posted content</div>';
    return;
  }
  const rows = posted.map((item,i)=>`
    <div class="posted-item" style="animation-delay:${i*28}ms">
      <span class="posted-platform">${esc(item.platform)}</span>
      <span class="posted-date">${fmtShort(item.approvedAt)}</span>
      <span class="posted-excerpt">${esc((item.content||'').slice(0,120))}</span>
      <span class="posted-badge">Posted</span>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="posted-col-heads">
      <span>Platform</span>
      <span>Date Posted</span>
      <span>Content</span>
      <span></span>
    </div>
    ${rows}
  `;
}

// ── INIT ──────────────────────────────────────────────────────────
renderPending();
renderCeo();
renderPosted();
updateBadges();
</script>
</body>
</html>
